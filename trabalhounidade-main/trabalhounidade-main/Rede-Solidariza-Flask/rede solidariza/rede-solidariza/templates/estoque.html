{% extends 'base.html' %}{% block content %}<div class="page-heading"><span class="eyebrow">TRANSPARÊNCIA E CUIDADO</span><h1>Estoque por ponto</h1><p>Quantidades disponíveis nesta demonstração.</p></div><section class="card"><form method="get" class="filter-row"><label>Ponto de coleta<select name="ponto">{% for p in pontos %}<option {{ 'selected' if p==ponto }}>{{ p }}</option>{% endfor %}</select></label><button class="button yellow">Consultar</button></form><div class="table-wrap"><table><thead><tr><th>Produto</th><th>Quantidade</th><th>Situação</th></tr></thead><tbody>{% for p,q in estoque.items() %}<tr><td>{{ icones[p] }} {{ p }}</td><td>{{ q }}</td><td><span class="pill {{ 'low' if q<10 }}">{{ 'Estoque baixo' if q<10 else 'Disponível' }}</span></td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
